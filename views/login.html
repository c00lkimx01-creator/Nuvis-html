<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - ログイン</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 24px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Space Mono', monospace;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .login-logo .n { color: var(--green); }
    .login-logo .uvis { color: #fff; }
    .login-sub {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 32px;
    }
    .login-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
    }
    .lock-icon {
      color: var(--green);
      margin-bottom: 12px;
    }
    .login-title {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .pw-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .pw-wrap input {
      padding-right: 44px;
    }
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      display: flex;
    }
    .pw-toggle:hover { color: var(--green); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 999px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #1ddf5e; }
    .login-error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 10px;
      display: none;
    }
    /* ambient glows */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .glow-blob-1 { width: 300px; height: 300px; background: rgba(45,255,110,0.08); bottom: 150px; left: -80px; }
    .glow-blob-2 { width: 200px; height: 200px; background: rgba(45,255,110,0.06); top: 80px; right: -40px; }
    .glow-blob-3 { width: 150px; height: 150px; background: rgba(45,255,110,0.05); bottom: 60px; right: 200px; }
  </style>
</head>
<body>
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>
  <div class="glow-blob glow-blob-3"></div>

  <div class="login-wrap">
    <div class="login-logo"><span class="n">N</span><span class="uvis">uvis</span></div>
    <div class="login-sub">YouTube Viewing Service</div>

    <div class="login-card">
      <div class="lock-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </div>
      <div class="login-title" data-i18n="login_title">パスワードを入力してください</div>

      <div class="pw-wrap">
        <input class="input-field" id="pw-input" type="password" data-i18n-placeholder="password" placeholder="パスワード">
        <button class="pw-toggle" onclick="togglePw()" type="button">
          <svg id="pw-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button class="login-btn" onclick="doLogin()" data-i18n="login_btn">ログイン</button>
      <div class="login-error" id="login-error">パスワードが正しくありません</div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    function togglePw() {
      const inp = document.getElementById('pw-input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
    function doLogin() {
      const pw = document.getElementById('pw-input').value;
      if (pw) {
        window.location.href = '/';
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }
    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
