<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - トレンド</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .trend-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .trend-tab {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text-dim);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .trend-tab.active, .trend-tab:hover {
      background: var(--green-glow);
      border-color: var(--green-dim);
      color: var(--green);
    }
    .trend-rank {
      font-family: 'Space Mono', monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--green);
      width: 40px;
      flex-shrink: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div id="navbar-container"></div>

  <div class="page-content main">
    <div class="container">
      <div class="section-header" style="margin-bottom:20px">
        <div class="section-title" data-i18n="trend">トレンド</div>
      </div>

      <div class="trend-tabs">
        <button class="trend-tab active">すべて</button>
        <button class="trend-tab">音楽</button>
        <button class="trend-tab">ゲーム</button>
        <button class="trend-tab">ニュース</button>
        <button class="trend-tab">スポーツ</button>
        <button class="trend-tab">テクノロジー</button>
      </div>

      <div class="video-grid" id="trend-grid"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('trend');
    applyLang(); initNavbar(); initSearch();

    document.querySelectorAll('.trend-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.trend-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    const trends = [
      { id:'tr1', title:'急上昇動画タイトル 1', channel:'チャンネルA', views:'2.4M', duration:'8:20' },
      { id:'tr2', title:'急上昇動画タイトル 2', channel:'チャンネルB', views:'1.8M', duration:'12:00' },
      { id:'tr3', title:'急上昇動画タイトル 3', channel:'チャンネルC', views:'980.0K', duration:'5:45' },
      { id:'tr4', title:'急上昇動画タイトル 4', channel:'チャンネルD', views:'750.0K', duration:'3:10' },
      { id:'tr5', title:'急上昇動画タイトル 5', channel:'チャンネルE', views:'640.0K', duration:'15:30' },
      { id:'tr6', title:'急上昇動画タイトル 6', channel:'チャンネルF', views:'530.0K', duration:'7:00' },
    ];

    const grid = document.getElementById('trend-grid');
    trends.forEach(v => {
      grid.innerHTML += `
        <div class="video-card" onclick="goWatch('${v.id}')">
          <div class="video-thumb">
            <div class="thumb-placeholder">
              <svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--green)"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span class="video-duration">${v.duration}</span>
          </div>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="video-channel">${v.channel}</div>
            <div class="video-meta">${v.views} ${t('views')}</div>
          </div>
        </div>`;
    });
  </script>
</body>
</html>
