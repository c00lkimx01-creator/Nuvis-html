<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - 検索</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div id="navbar-container"></div>

  <div class="page-content main" id="main-content">
    <div class="container">
      <div class="section-header" style="margin-bottom:20px">
        <div class="section-title">
          <span data-i18n="search_results">検索結果：</span>
          <span id="search-query-label" style="color:var(--green);font-weight:700"></span>
        </div>
      </div>

      <!-- Shorts row -->
      <div id="shorts-section" style="margin-bottom:32px">
        <div class="section-header" style="justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px;color:var(--green);font-size:14px;font-weight:700">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
            <span data-i18n="shorts">Shorts</span>
          </div>
          <div style="display:flex;gap:8px">
            <button onclick="scrollShorts(-1)" class="btn btn-outline" style="padding:6px 10px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <button onclick="scrollShorts(1)" class="btn btn-outline" style="padding:6px 10px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
        <div class="scroll-row" id="shorts-row" style="margin-top:12px">
          <!-- populated by JS -->
        </div>
      </div>

      <!-- Video results -->
      <div class="section-header">
        <div class="section-title" data-i18n="videos">動画</div>
      </div>
      <div class="video-grid" id="results-grid" style="margin-top:12px">
        <!-- populated by JS -->
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('');
    applyLang(); initNavbar(); initSearch();

    const params = new URLSearchParams(location.search);
    const q = params.get('q') || '';
    document.getElementById('search-query-label').textContent = q;
    document.title = `Nuvis - ${q}`;

    // Shorts
    const shortsRow = document.getElementById('shorts-row');
    for (let i = 1; i <= 5; i++) {
      shortsRow.innerHTML += `
        <div class="short-card" onclick="goWatch('s${i}')">
          <div class="short-thumb">
            <span class="short-badge">S</span>
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2010,#162a1a)">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.3;color:var(--green)"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span class="short-duration">0:${String(Math.floor(Math.random()*50+10)).padStart(2,'0')}</span>
          </div>
          <div class="short-title">Shorts ${i}</div>
        </div>`;
    }

    function scrollShorts(dir) {
      const row = document.getElementById('shorts-row');
      row.scrollBy({ left: dir * 300, behavior: 'smooth' });
    }

    // Results grid
    const grid = document.getElementById('results-grid');
    const channels = ['チャンネルA','チャンネルB','チャンネルC','チャンネルD','チャンネルE','チャンネルF'];
    const views = ['980.0K','320.0K','54.0K','1.5M','77.0K','210.0K'];
    const durations = ['6:55','10:30','4:40','15:00','3:10','6:00'];
    for (let i = 1; i <= 6; i++) {
      grid.innerHTML += `
        <div class="video-card" onclick="goWatch('r${i}')">
          <div class="video-thumb">
            <div class="thumb-placeholder">
              <svg viewBox="0 0 24 24" fill="currentColor" style="color:var(--green)"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span class="video-duration">${durations[i-1]}</span>
          </div>
          <div class="video-info">
            <div class="video-title">サンプル動画 検索結果 ${i}</div>
            <div class="video-channel">${channels[i-1]}</div>
            <div class="video-meta">${views[i-1]} ${t('views')}</div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
