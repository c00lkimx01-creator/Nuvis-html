<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - 設定</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div id="navbar-container"></div>

  <div class="page-content main">
    <div class="container" style="max-width:720px">
      <div class="section-header" style="margin-bottom:24px">
        <div class="section-title" data-i18n="settings">設定</div>
      </div>

      <!-- Language -->
      <div class="settings-section">
        <div class="settings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span data-i18n="lang_setting">言語</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label" data-i18n="lang_setting">言語</div>
            <div class="settings-sub">アプリの表示言語を変更します</div>
          </div>
          <select class="input-field" id="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
          </select>
        </div>
      </div>

      <!-- Appearance -->
      <div class="settings-section">
        <div class="settings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span data-i18n="appearance">外観</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label" data-i18n="dark_mode">ダークモード</div>
            <div class="settings-sub">常にダークモードで表示</div>
          </div>
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label" data-i18n="autoplay">自動再生</div>
            <div class="settings-sub">次の動画を自動的に再生</div>
          </div>
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Notifications -->
      <div class="settings-section">
        <div class="settings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span data-i18n="notifications">通知</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">プッシュ通知</div>
            <div class="settings-sub">新着動画の通知を受け取る</div>
          </div>
          <label class="toggle">
            <input type="checkbox">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Privacy -->
      <div class="settings-section">
        <div class="settings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <span data-i18n="privacy">プライバシー</span>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">視聴履歴の保存</div>
            <div class="settings-sub">視聴した動画を履歴に残す</div>
          </div>
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">検索履歴の保存</div>
            <div class="settings-sub">検索キーワードを保存する</div>
          </div>
          <label class="toggle">
            <input type="checkbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Account -->
      <div class="settings-section">
        <div class="settings-title">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          アカウント
        </div>
        <div class="settings-row">
          <div>
            <div class="settings-label">ログアウト</div>
            <div class="settings-sub">アカウントからサインアウト</div>
          </div>
          <a href="/login" class="btn btn-outline" style="font-size:12px">ログアウト</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('settings');
    applyLang(); initNavbar(); initSearch();
  </script>
</body>
</html>
