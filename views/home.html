<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - ホーム</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .home-hero {
      text-align: center;
      padding: 80px 24px 40px;
    }
    .home-hero h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    .home-hero h1 .nuvis { color: var(--green); }
    .home-hero h1 .rest { color: #fff; }
    .home-hero .subtitle {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 36px;
    }
    .hero-search {
      display: flex;
      align-items: center;
      max-width: 640px;
      margin: 0 auto 32px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 8px 0 20px;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .hero-search:focus-within {
      border-color: var(--green-dim);
      box-shadow: 0 0 0 3px rgba(45,255,110,0.08);
    }
    .hero-search input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
      padding: 14px 0;
    }
    .hero-search input::placeholder { color: var(--text-muted); }
    .hero-search-btn {
      background: var(--green);
      color: #000;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .hero-search-btn:hover { background: #1ddf5e; }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .hero-stat {
      text-align: center;
    }
    .hero-stat .num {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: var(--green);
    }
    .hero-stat .label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .trending-section {
      padding: 0 24px 40px;
      max-width: 1280px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- NAVBAR (hidden on home by default) -->
  <nav class="navbar" id="navbar">
    <a href="/" class="nav-logo"><span class="n">N</span><span class="uvis">uvis</span></a>
    <form class="nav-search search-form" onsubmit="return false">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" data-i18n-placeholder="search_placeholder">
      <button type="button" class="nav-search-btn" data-i18n="search_btn">検索</button>
    </form>
    <div class="nav-spacer"></div>
    <nav class="nav-links">
      <a href="/" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span data-i18n="home">ホーム</span>
      </a>
      <a href="/history" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-i18n="history">視聴履歴</span>
      </a>
      <a href="/trend" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span data-i18n="trend">トレンド</span>
      </a>
      <a href="/settings" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span data-i18n="settings">設定</span>
      </a>
    </nav>
    <button class="nav-eye-btn" id="nav-eye-btn" title="メニューを隠す">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </nav>

  <div class="page-content">
    <!-- Hero -->
    <div class="home-hero">
      <h1><span class="nuvis">Nuvis</span><span class="rest">へようこそ</span></h1>
      <p class="subtitle" data-i18n="subtitle">YouTube 視聴サービス</p>
      <form class="hero-search search-form" onsubmit="return false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-muted);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" data-i18n-placeholder="search_placeholder" placeholder="動画を検索...">
        <button type="button" class="hero-search-btn search-btn" data-i18n="search_btn">検索</button>
      </form>
      <div class="hero-stats">
        <div class="hero-stat"><div class="num">1,240</div><div class="label">動画視聴済み</div></div>
        <div class="hero-stat"><div class="num">48</div><div class="label">登録チャンネル</div></div>
        <div class="hero-stat"><div class="num">320h</div><div class="label">総視聴時間</div></div>
      </div>
    </div>

    <!-- Trending -->
    <div class="trending-section">
      <div class="section-header">
        <div class="section-title" data-i18n="trending">急上昇</div>
      </div>
      <div class="video-grid" id="trending-grid">
        <!-- JS populated -->
      </div>
    </div>
  </div>

  <!-- Show navbar button -->
  <button class="show-nav-btn" id="show-nav-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span data-i18n="show_menu">メニューを表示</span>
  </button>

  <script src="/js/app.js"></script>
  <script>
    // Sample data
    const trendingVideos = [
      { id:'t1', title:'サンプル動画タイトル 1', channel:'チャンネル名', views:'1.2M', duration:'5:12' },
      { id:'t2', title:'サンプル動画タイトル 2', channel:'チャンネル名', views:'850.0K', duration:'9:00' },
      { id:'t3', title:'サンプル動画タイトル 3', channel:'チャンネル名', views:'430.0K', duration:'3:30' },
      { id:'t4', title:'サンプル動画タイトル 4', channel:'チャンネル名', views:'220.0K', duration:'12:00' },
      { id:'t5', title:'サンプル動画タイトル 5', channel:'チャンネル名', views:'95.0K', duration:'3:00' },
      { id:'t6', title:'サンプル動画タイトル 6', channel:'チャンネル名', views:'310.0K', duration:'7:30' },
    ];

    const grid = document.getElementById('trending-grid');
    trendingVideos.forEach(v => {
      grid.innerHTML += `
        <div class="video-card" onclick="goWatch('${v.id}')">
          <div class="video-thumb">
            <div class="thumb-placeholder">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <span class="video-duration">${v.duration}</span>
          </div>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="video-channel">${v.channel}</div>
            <div class="video-meta">${v.views} ${t('views')}</div>
          </div>
        </div>`;
    });

    // Hide navbar on home by default
    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.getElementById('navbar');
      const showBtn = document.getElementById('show-nav-btn');
      const stored = localStorage.getItem('nuvis_nav_hidden');
      if (stored !== '0') {
        navbar.classList.add('hidden');
        showBtn.classList.add('visible');
      }
    });
  </script>
</body>
</html>
