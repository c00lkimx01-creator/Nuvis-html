<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvis - 視聴履歴</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="bg-glow bg-glow-1"></div>
  <div id="navbar-container"></div>

  <div class="page-content main">
    <div class="container">
      <div class="section-header" style="margin-bottom:24px;justify-content:space-between">
        <div class="section-title" data-i18n="history">視聴履歴</div>
        <button class="btn btn-outline" style="font-size:12px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          履歴を削除
        </button>
      </div>

      <div style="margin-bottom:32px">
        <div style="color:var(--text-muted);font-size:12px;margin-bottom:12px;font-weight:600">今日</div>
        <div class="video-list" id="history-today"></div>
      </div>
      <div>
        <div style="color:var(--text-muted);font-size:12px;margin-bottom:12px;font-weight:600">昨日</div>
        <div class="video-list" id="history-yesterday"></div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar('history');
    applyLang(); initNavbar(); initSearch();

    const sampleHistory = [
      { id:'h1', title:'サンプル動画タイトル 1', channel:'チャンネル名', views:'1.2M', duration:'5:12', ago:'2時間前' },
      { id:'h2', title:'サンプル動画タイトル 2', channel:'チャンネル名', views:'850.0K', duration:'9:00', ago:'4時間前' },
      { id:'h3', title:'サンプル動画タイトル 3', channel:'チャンネル名', views:'430.0K', duration:'3:30', ago:'6時間前' },
    ];
    const yesterday = [
      { id:'h4', title:'サンプル動画タイトル 4', channel:'チャンネル名', views:'220.0K', duration:'12:00', ago:'1日前' },
      { id:'h5', title:'サンプル動画タイトル 5', channel:'チャンネル名', views:'95.0K', duration:'3:00', ago:'1日前' },
    ];

    function renderHistoryList(items, containerId) {
      const el = document.getElementById(containerId);
      items.forEach(v => {
        el.innerHTML += `
          <div class="video-list-item" onclick="goWatch('${v.id}')">
            <div class="video-list-thumb">
              <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1a2a1e">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="opacity:0.3;color:var(--green)"><path d="M8 5v14l11-7z"/></svg>
              </div>
              <span class="video-duration">${v.duration}</span>
            </div>
            <div class="video-list-info">
              <div class="video-list-title">${v.title}</div>
              <div class="video-list-channel">${v.channel}</div>
              <div class="video-list-meta">${v.views} ${t('views')} · ${v.ago}</div>
            </div>
          </div>`;
      });
    }

    renderHistoryList(sampleHistory, 'history-today');
    renderHistoryList(yesterday, 'history-yesterday');
  </script>
</body>
</html>
